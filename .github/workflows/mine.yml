name: lead-miner
# Free-compute lead mining on GitHub Actions (no serverless time limit).
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6h — the 24/7 loop is primary; this just tops up (less token contention)
  workflow_dispatch: {}       # manual "Run workflow" button

concurrency:
  group: lead-miner
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Mine OSS contributors -> engine
        env:
          NETLIFY_BASE: ${{ secrets.NETLIFY_BASE }}
          NETLIFY_AUTH: ${{ secrets.NETLIFY_AUTH }}
          GH_TOKEN: ${{ secrets.MINER_GH_TOKEN }}
        run: node miner.mjs
